<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- Test fixture only (task 4.1): a probe element built on window.MockElement. Not a real page. -->
  <title>MockElement fixture</title>
  <script src="../../assets/js/theme-boot.js"></script>
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>
  <mk-test-probe id="probe-found" post-id="p-101"></mk-test-probe>
  <mk-test-probe id="probe-missing" post-id="p-999"></mk-test-probe>
  <script src="../../data/screens.js"></script>
  <script src="../../data/sample-data.js"></script>
  <script src="../../assets/i18n/messages.ja.js"></script>
  <script src="../../assets/i18n/messages.en.js"></script>
  <script src="../../assets/js/mock-state.js"></script>
  <script src="../../assets/js/i18n.js"></script>
  <script src="../../assets/js/components/base.js"></script>
  <script>
    // Probe: renders "{post id} {lang}" when the post exists, otherwise the missing-sample text.
    class MockTestProbe extends window.MockElement {
      constructor() {
        super();
        this.renders = 0;
      }
      render(state) {
        this.renders += 1;
        this.setAttribute('data-renders', String(this.renders));
        const id = this.getAttribute('post-id') || '';
        const post = this.sample().posts.find((p) => p.id === id);
        this.replaceChildren(post ? this.el('span', null, `${post.id} ${state.lang}`) : this.missingSample(id));
      }
    }
    customElements.define('mk-test-probe', MockTestProbe);
  </script>
</body>
</html>
