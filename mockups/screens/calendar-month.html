<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="screen.calendar-month.title">月のカレンダー</title>
  <script src="../assets/js/theme-boot.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/wireframe.css">
  <link rel="stylesheet" href="../assets/css/review.css">
</head>
<body data-screen-id="calendar-month">
  <mk-site-header></mk-site-header>
  <!-- Task 8.1: the read-only notice for guests, one band in the same place on every screen. -->
  <mk-guest-notice band data-when-auth="guest"></mk-guest-notice>
  <main class="l-container l-stack">
    <h1 data-i18n="screen.calendar-month.title">月のカレンダー</h1>
    <p data-when-auth="member">
      <a class="button" href="post-edit.html?auth=member" data-i18n="button.post">投稿する</a>
    </p>

    <!-- Task 8.1: one calendar, Monday first, with month navigation. The month comes from
         ?month=YYYY-MM, else 2026-11 (2027-03, provisional equinox holidays, in the
         provisional-holiday scenario); the page script at the end keeps the h2 and ?month in sync.
         caption="hidden": the h2 shows the month, so the table's caption is for screen readers only. -->
    <section class="screen-section l-stack" aria-labelledby="calendar-month-heading">
      <h2 id="calendar-month-heading"><span class="screen-decor" data-decor aria-hidden="true">✦ </span><span data-calendar-heading data-i18n-date="2026-11-01" data-date-style="month-year">2026年11月</span></h2>
      <mk-month-calendar data-calendar month="2026-11" week-start="mon" nav caption="hidden"></mk-month-calendar>
    </section>
  </main>
  <mk-site-footer></mk-site-footer>
  <script src="../data/screens.js"></script>
  <script src="../data/glossary.js"></script>
  <script src="../data/sample-data.js"></script>
  <script src="../assets/i18n/messages.ja.js"></script>
  <script src="../assets/i18n/messages.en.js"></script>
  <script src="../assets/js/mock-state.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/components/base.js"></script>
  <script src="../assets/js/components/shell.js"></script>
  <script src="../assets/js/components/almanac.js"></script>
  <script src="../assets/js/components/sky.js"></script>
  <script src="../assets/js/components/posts.js"></script>
  <script src="../assets/js/components/location.js"></script>
  <script src="../assets/js/review-shell.js"></script>
  <script>
    // Month calendar page script (task 8.1). Runs before DOMContentLoaded, so the i18n runtime
    // formats the heading it sets.
    // - ?month=YYYY-MM picks the month; an invalid value falls back with a warning. Without it the
    //   month is the sample today's (2026-11), or 2027-03 in the provisional-holiday scenario.
    // - The calendar's month buttons fire mk-month-change: the h2 follows, and ?month is written
    //   with replaceState, so the other parameters (stage, lang, theme, auth, scenario) stay.
    // - A scenario switch goes back to that scenario's month and drops ?month.
    (function () {
      const calendar = document.querySelector('[data-calendar]');
      const heading = document.querySelector('[data-calendar-heading]');
      if (calendar === null || heading === null) return;
      /** @param {string} scenario */
      const initialMonth = (scenario) => (scenario === 'provisional-holiday' ? '2027-03' : window.MockSample.today.slice(0, 7));
      /** @param {string} month */
      const show = (month) => {
        if (calendar.getAttribute('month') !== month) calendar.setAttribute('month', month);
        heading.setAttribute('data-i18n-date', `${month}-01`);
        heading.textContent = window.MockI18n.formatDate(`${month}-01`, 'month-year');
      };
      /** @param {string | null} month */
      const writeUrl = (month) => {
        try {
          const url = new URL(window.location.href);
          if (month === null) url.searchParams.delete('month');
          else url.searchParams.set('month', month);
          window.history.replaceState(window.history.state, '', url.href);
        } catch {
          // replaceState can be refused in unusual embeddings; the calendar still moves.
        }
      };

      let scenario = window.MockState.get().scenario;
      let month = initialMonth(scenario);
      const requested = new URLSearchParams(window.location.search).get('month');
      if (requested !== null) {
        if (/^\d{4}-(0[1-9]|1[0-2])$/.test(requested)) month = requested;
        else console.warn(`[calendar-month] invalid month=${requested}; showing ${month}`);
      }
      show(month);

      calendar.addEventListener('mk-month-change', (event) => {
        const detail = /** @type {CustomEvent<{ month: string }>} */ (event).detail;
        show(detail.month);
        writeUrl(detail.month);
      });
      document.addEventListener('mock:change', (event) => {
        const next = /** @type {CustomEvent<MockStateSnapshot>} */ (event).detail.scenario;
        if (next === scenario) return;
        scenario = next;
        show(initialMonth(scenario));
        writeUrl(null);
      });
    })();
  </script>
</body>
</html>
